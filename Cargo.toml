[package]
name = "octa-term"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Seamless terminal math evaluation via the system GNU Octave"

[lib]
name = "octa_term"
path = "src/lib.rs"

[[bin]]
name = "octa-term"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3.15"

[profile.release]
lto = "thin"
strip = "symbols"
